[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-usage-windows"
version = "1.0.0"
description = "Claude usage in the Windows system tray"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7,<7", "keyring>=25,<27"]

[project.scripts]
claude-usage-windows = "claude_usage_windows.app:main"

[tool.setuptools.packages.find]
where = ["."]
